<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كاشير LAP Coffee</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2b2118;--mu:#7a6a5c;--ac:#8a4b22;--on:#fff;--ac2:#f1e3d3;--ok:#2f7d4f;--bad:#b3392f;--bd:#e6dbcf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#2a231d;--tx:#f3eadf;--mu:#b5a594;--ac:#e09a63;--on:#1c1713;--ac2:#3b2e24;--ok:#5fc08a;--bad:#ef7d72;--bd:#3d332a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1713;--card:#2a231d;--tx:#f3eadf;--mu:#b5a594;--ac:#e09a63;--on:#1c1713;--ac2:#3b2e24;--ok:#5fc08a;--bad:#ef7d72;--bd:#3d332a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:70px}
header{padding:14px 16px 6px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
header small{color:var(--mu);font-weight:400;font-size:12px}
main{padding:8px 12px 12px;max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px;font-size:12px;font-family:inherit;position:relative}
nav button b{display:block;font-size:19px}
nav button.on{color:var(--ac);font-weight:700}
nav i{position:absolute;top:4px;inset-inline-start:50%;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-style:normal}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 8px;text-align:center;color:var(--tx);font-family:inherit;font-size:15px}
.item:active{background:var(--ac2)}.item span{display:block;color:var(--ac);font-weight:700;margin-top:4px}
.item.out{opacity:.4}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--on);font-family:inherit;font-size:14px;font-weight:700}
.btn.s{background:var(--ac2);color:var(--ac)}.btn.g{background:var(--ok);color:#fff}
.q{display:flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
h3{margin:4px 0 8px;font-size:15px}.mu{color:var(--mu);font-size:12px}
.tot{font-size:20px;font-weight:700}
.tag{font-size:11px;border-radius:8px;padding:2px 8px;background:var(--ac2);color:var(--ac)}
.tag.bad{background:var(--bad);color:#fff}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:4px}.bar div{height:100%;background:var(--ok)}.bar .lo{background:var(--bad)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.kpi b{display:block;font-size:20px;color:var(--ac)}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9;max-width:90%}
@media print{nav,header .btn,.noprint{display:none}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:7px 12px;font-family:inherit;font-size:13px}.chips button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}.item small{display:block;color:var(--mu);font-size:11px}header{background:#1c1713;color:#f3eadf;justify-content:flex-start;gap:12px;padding:10px 16px;font-size:15px}
header img{height:48px}.hm{flex:1;line-height:1.4}.hm small{color:#b5a594!important;display:block}
input,select{width:100%;padding:11px 12px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:15px}
.auth{max-width:340px;margin:8vh auto 0;background:#1c1713;color:#f3eadf;border-radius:18px;padding:26px 22px;text-align:center}
.auth .lg{height:130px;margin-bottom:6px}.auth h2{font-size:17px;margin:6px 0 12px}
.auth input{background:#2a231d;border-color:#3d332a;color:#f3eadf}.auth .btn{width:100%;margin-top:6px;background:#e09a63;color:#1c1713}
.err{color:#ef7d72;min-height:20px;font-size:13px}
</style></head><body>

<header id="hd"></header>
<main id="app"></main>
